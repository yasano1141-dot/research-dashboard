<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>その他 — Research Dashboard</title>
<link rel="stylesheet" href="css/style.css?v=20260614">
<meta property="og:title" content="その他（依頼テーマ）論文 — Research Dashboard">
<meta property="og:description" content="曜日テーマ・PD研究と並ぶ独立カテゴリ。都度依頼したテーマの論文を集約。">
<meta property="og:type" content="website">
<link rel="alternate" type="application/rss+xml" title="Research Dashboard RSS" href="rss.xml">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230d9488'/%3E%3Ctext x='50' y='68' text-anchor='middle' font-size='52' fill='white'%3E%F0%9F%97%82%3C/text%3E%3C/svg%3E">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="index.html"><span class="logo">R</span><span>Research Dashboard</span></a>
    <nav class="nav">
      <a href="index.html">ホーム</a>
      <a href="papers.html">論文一覧</a>
      <a href="themes.html">曜日テーマ</a>
      <a href="pd.html">📍 PD</a>
      <a href="other.html">🗂 その他</a>
      <a href="favorites.html">お気に入り</a>
    </nav>
    <div class="spacer"></div>
    <a class="fav-pill" href="favorites.html"><span class="star">★</span><span>お気に入り</span><span class="count">0</span></a>
  </div>
</header>

<main>
  <h1 class="page-title" style="color:#0d9488">🗂 その他（依頼テーマ）</h1>
  <p class="page-subtitle">曜日テーマ・PD研究と並ぶ独立カテゴリ。都度依頼したテーマの論文を集約 ／ <span id="other-count">0</span>本</p>

  <div class="hero-grid">
    <div class="latest-card" id="other-summary" style="--theme-color:#0d9488">
      <div class="latest-label">運用</div>
      <h2 class="latest-title" id="other-latest-topic">依頼テーマのキュレーション</h2>
      <p class="latest-meta">「その他で〇〇のテーマをまとめて」と依頼すると、そのテーマの論文10本を生成しここに追加します。テーマごとにレポートが分かれます。</p>
      <div class="latest-actions" id="other-latest-actions">
        <a class="btn" href="favorites.html">★ お気に入り</a>
      </div>
    </div>
    <div class="stats-card">
      <h3>分布</h3>
      <div class="stats-grid">
        <div class="stat"><div class="num" id="stat-other-papers">—</div><div class="label">その他論文</div></div>
        <div class="stat"><div class="num" id="stat-other-reports">—</div><div class="label">テーマ数</div></div>
        <div class="stat"><div class="num" id="stat-other-fav">—</div><div class="label">お気に入り</div></div>
        <div class="stat"><div class="num" id="stat-other-3star">—</div><div class="label">★3つ</div></div>
      </div>
    </div>
  </div>

  <!-- テーマ別レポート一覧 -->
  <div id="other-topics" class="theme-report-list" style="margin-bottom:28px"></div>

  <div class="controls">
    <input type="search" id="q" class="search-input" placeholder="🔍 タイトル・著者・要約で検索…">
    <select id="sort" class="sort">
      <option value="date-desc">新しい順</option>
      <option value="fav">お気に入り順</option>
      <option value="rating">★評価順</option>
    </select>
    <select id="show-detail" class="filter">
      <option value="0">概要のみ</option>
      <option value="1">詳細を全展開</option>
    </select>
  </div>

  <div class="papers-list" id="other-papers"></div>
</main>

<footer class="site-footer"><p>© 2026 Yujiro Asano · Tohoku University · <a href="rss.xml">RSS</a></p></footer>

<script src="js/favorites.js?v=20260614"></script>
<script src="js/site.js?v=20260614"></script>
<script>
(async () => {
  const [papers, reports] = await Promise.all([SITE.loadPapers(), SITE.loadReports()]);
  const reportById = new Map(reports.map(r => [r.id, r]));

  // 「その他」レポート（weekday==="other"）の id 集合
  const otherReports = reports.filter(r => r.weekday === "other")
    .sort((a, b) => (b.date || "").localeCompare(a.date || ""));
  const otherReportIds = new Set(otherReports.map(r => r.id));

  // その他レポートに属する論文
  const otherPapers = papers.filter(p =>
    (p.source_reports || []).some(rid => otherReportIds.has(rid)));

  document.getElementById("other-count").textContent = otherPapers.length;
  document.getElementById("stat-other-papers").textContent = otherPapers.length;
  document.getElementById("stat-other-reports").textContent = otherReports.length;

  // 最新テーマをヒーローに反映
  if (otherReports.length) {
    const latest = otherReports[0];
    const topic = latest.topic_label || latest.theme_jp || "依頼テーマ";
    document.getElementById("other-latest-topic").textContent = topic;
    document.getElementById("other-latest-actions").innerHTML =
      `<a class="btn" href="reports/${latest.id}.html" style="background:#0d9488;border-color:#0d9488;color:#fff">最新レポートを開く →</a>
       <a class="btn" href="favorites.html">★ お気に入り</a>`;
  }

  // テーマ別レポート一覧
  const topicsBox = document.getElementById("other-topics");
  if (otherReports.length) {
    topicsBox.innerHTML = `<h3 style="margin:0 0 12px;font-size:15px;color:#475569">テーマ別レポート（${otherReports.length}）</h3>` +
      otherReports.map(r => {
        const topic = r.topic_label || r.theme_jp || "依頼テーマ";
        return `<a class="theme-report-item" href="reports/${r.id}.html" style="display:flex;align-items:center;gap:10px;padding:10px 14px;border:1px solid #e2e8f0;border-radius:8px;margin-bottom:8px;text-decoration:none;color:#0f172a;background:#fff">
          <span style="background:#0d9488;color:#fff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px">🗂 その他</span>
          <span style="font-weight:600">${escapeHtml(topic)}</span>
          <span style="margin-left:auto;color:#94a3b8;font-size:12px">${SITE.fmtDateShort(r.date)} ・ ${r.paper_count || (r.paper_ids||[]).length}本</span>
        </a>`;
      }).join("");
  }

  function updateFavStats() {
    const favs = Favorites.list();
    const ids = new Set(otherPapers.map(p => p.id));
    const f = favs.filter(x => ids.has(x.id));
    document.getElementById("stat-other-fav").textContent = f.length;
    document.getElementById("stat-other-3star").textContent = f.filter(x => (x.rating||0) >= 3).length;
  }
  updateFavStats();
  document.addEventListener("favorites:change", updateFavStats);

  const q = document.getElementById("q");
  const sortSel = document.getElementById("sort");
  const detailSel = document.getElementById("show-detail");
  q.addEventListener("input", debounce(render, 120));
  sortSel.addEventListener("change", render);
  detailSel.addEventListener("change", render);

  const dateOf = p => {
    const r = (p.source_reports || []).map(rid => reportById.get(rid)).filter(Boolean)
      .filter(r => r.weekday === "other")[0];
    return r ? r.date : "";
  };

  function render() {
    const term = q.value.trim().toLowerCase();
    const expand = detailSel.value === "1";
    let arr = otherPapers.slice();

    if (term) {
      arr = arr.filter(p => {
        const haystack = [p.title, p.authors, p.journal, p.summary, p.overview,
                          (p.tags||[]).join(" "), p.implication, p.idea].filter(Boolean).join(" ").toLowerCase();
        return haystack.includes(term);
      });
    }

    const sortBy = sortSel.value;
    arr.sort((a, b) => {
      if (sortBy === "date-desc") return (dateOf(b)||"").localeCompare(dateOf(a)||"");
      if (sortBy === "fav") {
        const af = Favorites.has(a.id) ? 1 : 0, bf = Favorites.has(b.id) ? 1 : 0;
        if (bf !== af) return bf - af;
        return (dateOf(b)||"").localeCompare(dateOf(a)||"");
      }
      if (sortBy === "rating") {
        const ar = (Favorites.get(a.id) || {}).rating || 0;
        const br = (Favorites.get(b.id) || {}).rating || 0;
        return br - ar;
      }
      return 0;
    });

    const list = document.getElementById("other-papers");
    if (arr.length === 0) {
      list.innerHTML = `<div class="empty-state"><div class="em">📭</div>まだ「その他」テーマのレポートがありません。「その他で〇〇をまとめて」と依頼してください。</div>`;
      return;
    }
    list.innerHTML = arr.map(p => renderPaper(p, expand)).join("");
    attachActions(list);
  }

  function renderPaper(p, expand) {
    const r = (p.source_reports || []).map(rid => reportById.get(rid)).filter(Boolean)
      .filter(r => r.weekday === "other")[0];
    const topic = r ? (r.topic_label || r.theme_jp) : null;
    const c = "#0d9488";
    const isFav = Favorites.has(p.id);
    const fav = Favorites.get(p.id) || {};
    const detailFields = [
      ["要約", p.summary], ["概要", p.overview], ["重要な点", p.importance],
      ["方法論", p.methodology], ["限界", p.limitation], ["示唆", p.implication],
      ["研究アイデア", p.idea], ["新規性", p.novelty],
    ].filter(([_, v]) => v && String(v).trim());

    return `
      <article class="paper-row" id="paper-${p.id}" style="--c:${c}">
        <div class="row-head">
          <button class="fav-btn ${isFav ? "on" : ""}" data-pid="${p.id}">${isFav ? "★" : "☆"}</button>
          <h3><a href="${p.url || "#"}" target="_blank" rel="noopener">${escapeHtml(p.title)}</a></h3>
        </div>
        <p class="meta">${escapeHtml(p.authors || "")} · <i>${escapeHtml(p.journal || "")}</i></p>
        ${p.summary ? `<p class="summary">${escapeHtml(p.summary)}</p>` : ""}
        <div class="footer">
          <span class="theme-chip" style="--c:#0d9488">🗂 その他</span>
          ${topic ? `<span class="tag-chip">${escapeHtml(topic)}</span>` : ""}
          ${(p.tags || []).slice(0, 4).map(tg => `<span class="tag-chip">${escapeHtml(tg)}</span>`).join("")}
          ${r ? `<a href="reports/${r.id}.html">レポート（${SITE.fmtDateShort(r.date)}）</a>` : ""}
          ${detailFields.length ? `<button class="btn expand-btn" data-pid="${p.id}" style="margin-left:auto;padding:4px 10px;font-size:12px">詳細</button>` : ""}
          <span class="rating" data-pid="${p.id}">
            ${[1,2,3].map(n => `<span class="r-star ${(fav.rating||0)>=n?'on':''}" data-r="${n}">★</span>`).join("")}
          </span>
        </div>
        <div class="row-detail ${expand ? 'open' : ''}" id="detail-${p.id}">
          ${detailFields.map(([label, v]) => `<div class="field"><div class="field-label">${label}</div><div class="field-val">${escapeHtml(v)}</div></div>`).join("")}
        </div>
      </article>`;
  }

  function attachActions(scope) {
    scope.querySelectorAll(".fav-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        const p = otherPapers.find(x => x.id === btn.dataset.pid);
        if (!p) return;
        const added = Favorites.toggle(p);
        btn.classList.toggle("on", added);
        btn.textContent = added ? "★" : "☆";
        SITE.toast(added ? "お気に入りに追加" : "お気に入りから削除");
      });
    });
    scope.querySelectorAll(".rating").forEach(rt => {
      rt.querySelectorAll(".r-star").forEach(s => {
        s.addEventListener("click", () => {
          const pid = rt.dataset.pid;
          const rr = parseInt(s.dataset.r, 10);
          const p = otherPapers.find(x => x.id === pid);
          if (!p) return;
          if (!Favorites.has(p.id)) Favorites.add(p);
          const cur = Favorites.get(p.id);
          const newRating = (cur && cur.rating === rr) ? 0 : rr;
          Favorites.rate(p.id, newRating);
          rt.querySelectorAll(".r-star").forEach((x, i) => x.classList.toggle("on", (i+1) <= newRating));
        });
      });
    });
    scope.querySelectorAll(".expand-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.getElementById("detail-" + btn.dataset.pid).classList.toggle("open");
      });
    });
  }

  function escapeHtml(s) {
    return (s || "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
  }
  function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }

  render();
  document.addEventListener("favorites:change", render);
})();
</script>
</body>
</html>
