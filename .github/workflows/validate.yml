name: Validate Site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate JSON files
        run: |
          set -e
          for f in docs/data/*.json scripts/themes.json; do
            echo "Validating $f"
            python3 -c "import json; json.load(open('$f'))"
          done

      - name: Check critical files exist
        run: |
          test -f docs/index.html
          test -f docs/papers.html
          test -f docs/favorites.html
          test -f docs/themes.html
          test -f docs/css/style.css
          test -f docs/js/favorites.js
          test -f docs/js/site.js
          test -f docs/data/papers.json
          test -f docs/data/reports.json
          test -f vercel.json
          test -f scripts/daily_generator.py
          test -f scripts/themes.json
          test -f scripts/requirements.txt
          echo "✅ all required files present"

      - name: Python syntax check
        run: |
          python3 -m py_compile scripts/*.py
          echo "✅ Python syntax OK"

      - name: Lint HTML (basic)
        run: |
          for f in docs/*.html; do
            grep -q "</html>" "$f" || (echo "❌ $f missing closing tag" && exit 1)
          done
          echo "✅ HTML files look closed"
