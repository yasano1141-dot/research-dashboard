name: Daily Research Report

on:
  schedule:
    - cron: '0 23 * * *'   # 23:00 UTC = 8:00 JST (翌日)
  workflow_dispatch:
    inputs:
      weekday:
        description: 'Override weekday (auto/monday/.../sunday)'
        type: choice
        options: [auto, monday, tuesday, wednesday, thursday, friday, saturday, sunday]
        default: auto
      type:
        description: 'Report type'
        type: choice
        options: [auto, regular, pd_focused]
        default: auto
      dry_run:
        description: 'Dry run (no file writes, no commit)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Generate report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          USE_OPUS: ${{ secrets.USE_OPUS }}
          TZ: Asia/Tokyo
        run: |
          ARGS=""
          [ -n "${{ inputs.weekday }}" ] && [ "${{ inputs.weekday }}" != "auto" ] && ARGS="$ARGS --weekday ${{ inputs.weekday }}"
          [ -n "${{ inputs.type }}" ] && [ "${{ inputs.type }}" != "auto" ] && ARGS="$ARGS --type ${{ inputs.type }}"
          [ "${{ inputs.dry_run }}" = "true" ] && ARGS="$ARGS --dry-run"
          echo "Running: python scripts/daily_generator.py $ARGS"
          python scripts/daily_generator.py $ARGS

      - name: Generate RSS feed
        if: ${{ inputs.dry_run != true }}
        run: python scripts/generate_rss.py

      - name: Commit and push
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n $(git status --porcelain docs/data/ docs/reports/ docs/rss.xml) ]]; then
            git add docs/data/ docs/reports/ docs/rss.xml
            DATE=$(TZ=Asia/Tokyo date +%Y-%m-%d)
            WEEKDAY=$(TZ=Asia/Tokyo date +%A)
            git commit -m "🤖 Daily update: $DATE ($WEEKDAY)"
            git push
            echo "✅ Pushed update"
          else
            echo "ℹ️  No changes — generator may have failed silently."
          fi
